appId: at.kurtsoeser.mailclient
productName: Chronell
# package.json "name" ist mailclient — ohne executableName heißt die EXE sonst mailclient.exe
executableName: Chronell
copyright: Copyright (c) 2026 Kurt Soeser

directories:
  buildResources: resources
  output: release/${version}

files:
  - '!release/**'
  - '!docs/**'
  - '!**/.vscode/*'
  - '!**/.cursor/**'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.json,tsconfig.*,electron-builder.yml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tailwind.config.js,postcss.config.js,eslint.config.js}'
  - '!npm-install.log'
  - '!**/*.pptx'
  - '!**/~$*'

asarUnpack:
  - resources/**

# Icons neben der EXE (für setIcon in Popouts / Laufzeit-Fallback)
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

# signAndEditExecutable: false — vermeidet winCodeSign-7z/Symlink-Fehler ohne Admin/Developer Mode.
# Icon + EXE-Metadaten: scripts/after-pack-embed-icon.cjs (rcedit, nach dem Packen).
afterPack: scripts/after-pack-embed-icon.cjs

win:
  icon: icon.ico
  legalTrademarks: Chronell
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  shortcutName: Chronell
  oneClick: false
  # true = klassische Installation unter C:\Program Files\Chronell (Admin-Rechte beim Setup)
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Chronell
  guid: 7c4e8f2a-9b1d-4e6a-a3f5-2d8c1b0e9f7a
  include: build/installer.nsh
  runAfterFinish: true

publish: null
