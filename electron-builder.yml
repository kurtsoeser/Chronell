appId: at.kurtsoeser.chronell
productName: Chronell
# package.json "name" bleibt mailclient (npm) — executableName steuert die EXE
executableName: Chronell
copyright: Copyright (c) 2026 Kurt Soeser

# Kleinere NSIS-Installer (<100 MB fuer GitHub Pages): LZMA-max + weniger Ballast im Paket
compression: maximum

# Im gepackten app.asar sonst weiterhin name: mailclient → Windows/Electron zeigt „MailClient“
extraMetadata:
  name: chronell
  productName: Chronell

directories:
  buildResources: resources
  output: release/${version}

files:
  - '!release/**'
  - '!docs/**'
  - '!**/.vscode/*'
  - '!**/.cursor/**'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.json,tsconfig.*,electron-builder.yml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tailwind.config.js,postcss.config.js,eslint.config.js}'
  - '!npm-install.log'
  - '!**/*.pptx'
  - '!**/~$*'
  # Nur Ausschlüsse (kein positives Pattern!) — sonst packt electron-builder nicht out/** (siehe GH #1741)
  - '!resources/branding/*.svg'
  - '!resources/branding/chronell-logo.png'

asarUnpack:
  - '**/*.node'
  - resources/icon.ico
  - resources/icon.png
  - resources/branding/chronell-icon.png

# Icons neben der EXE (für setIcon in Popouts / Laufzeit-Fallback)
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  - from: resources/demo/chronell-demo-pack.zip
    to: demo/chronell-demo-pack.zip
  - from: resources/demo/demo-pack-manifest.json
    to: demo/demo-pack-manifest.json

# signAndEditExecutable: false — vermeidet winCodeSign-7z/Symlink-Fehler ohne Admin/Developer Mode.
# Icon + EXE-Metadaten: scripts/after-pack-embed-icon.cjs (rcedit, nach dem Packen).
afterPack: scripts/after-pack-embed-icon.cjs

fileAssociations:
  - ext: ics
    name: iCalendar
    description: iCalendar-Termin (.ics)
    role: Editor

win:
  icon: icon.ico
  publisherName: Kurt Soeser
  legalTrademarks: Chronell
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  shortcutName: Chronell
  oneClick: false
  # true = klassische Installation unter C:\Program Files\Chronell (Admin-Rechte beim Setup)
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Chronell
  # Neuer GUID: erzwingt saubere Verknüpfungen; alte „MailClient“-Installation vorher deinstallieren
  guid: a8f3c2e1-4d5b-4f6a-9c0e-1b2d3e4f5a6b
  include: build/installer.nsh
  runAfterFinish: true

publish: null
