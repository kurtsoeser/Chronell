name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for tests
        run: npm rebuild better-sqlite3

      - name: Quality checks
        run: npm run check

      - name: P0/P1 repo coverage
        run: npm run test:coverage:repos
